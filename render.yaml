databases:
  - name: lexopen-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: lexopen
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lexopen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PJUD_SECRETS_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: LexOpen
      - key: HERMES_ALLOW_DEMO
        value: "0"
      - key: LEXOPEN_DEMO_SWITCHER
        value: "0"
      - key: LEXOPEN_TRUSTED_PROXY
        value: "1"
      - key: HERMES_API_URL
        sync: false
      - key: HERMES_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PJUD_API_URL
        sync: false
      - key: PJUD_API_KEY
        sync: false
      - key: PJUD_SCRAPER_URL
        fromService:
          name: lexopen-pjud-scraper
          type: pserv
          property: hostport
      - key: PJUD_SCRAPER_KEY
        sync: false
      - key: PJUD_SCRAPER_ALLOW_PRIVATE
        value: "1"
      - key: PJUD_PUBLIC_SCRAPE
        value: "0"
      - key: CAPTCHA_SOLVER_PROVIDER
        sync: false
      - key: CAPTCHA_SOLVER_API_KEY
        sync: false
      - key: PJUD_CLAVEUNICA_SCRAPE
        value: "0"
      - key: PJUD_ALLOW_DEMO
        value: "0"
      - key: PJUD_PDF_BACKUP
        value: "0"
      - key: CRON_SECRET
        sync: false

  # Sidecar scrape privado (Playwright + CAPTCHA). Red interna Render.
  - type: pserv
    name: lexopen-pjud-scraper
    runtime: node
    plan: starter
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: npm run pjud:scraper
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: PJUD_PUBLIC_SCRAPE
        value: "1"
      - key: PJUD_CLAVEUNICA_SCRAPE
        value: "1"
      - key: PJUD_SCRAPER_KEY
        sync: false
      - key: CAPTCHA_SOLVER_PROVIDER
        sync: false
      - key: CAPTCHA_SOLVER_API_KEY
        sync: false
      - key: PJUD_CAUSAS_DAILY_SOLVE_BUDGET
        value: "50"

  # Cartera due-based cada 6h (UTC)
  - type: cron
    name: lexopen-pjud-sync
    runtime: node
    schedule: "0 */6 * * *"
    buildCommand: npm install
    startCommand: curl -fsS -X POST "http://$WEB_HOSTPORT/api/causas/monitoreo" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{}"
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        sync: false

  # Mis Causas ~08:00 America/Santiago (11:00 UTC estándar)
  - type: cron
    name: lexopen-mis-causas
    runtime: node
    schedule: "0 11 * * *"
    buildCommand: npm install
    startCommand: curl -fsS -X POST "http://$WEB_HOSTPORT/api/pjud/mis-causas" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{\"syncMovimientos\":true}"
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        sync: false

  # Digest email/in-app ~08:00 America/Santiago (11:00 UTC)
  - type: cron
    name: lexopen-pjud-digest
    runtime: node
    schedule: "0 11 * * *"
    buildCommand: npm install
    startCommand: curl -fsS -X POST "http://$WEB_HOSTPORT/api/pjud/digest" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{}"
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        sync: false
