# LexOpen — Blueprint de producción en Render
# Desplegar: https://dashboard.render.com/blueprint/new?repo=https://github.com/gabrielperezibacache/lexopen
#
# Costos aproximados (planes no free): web starter + Postgres basic-256mb +
# sidecar PJUD starter + 3 crons starter. El plan free no sirve para producción:
# el web se apaga a los 15 min y Postgres free caduca a los 30 días.
#
# Tras el primer deploy:
# 1) Copie LEXOPEN_BOOTSTRAP_TOKEN desde Environment del servicio `lexopen`
# 2) Abra https://<servicio>.onrender.com/setup?token=<token>
# 3) Cree el admin del estudio (sin seed demo)
# 4) Configure S3_* (documentos) y, si aplica, Hermes / Google / CAPTCHA
# 5) Defina NEXT_PUBLIC_APP_URL con la URL pública canónica

databases:
  - name: lexopen-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: lexopen
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexopen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PJUD_SECRETS_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PJUD_SCRAPER_KEY
        generateValue: true
      # Token de un uso para crear el primer admin en /setup (sin datos demo)
      - key: LEXOPEN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: LexOpen
      # Tras el deploy, fije la URL pública (https://….onrender.com o dominio propio)
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: HERMES_ALLOW_DEMO
        value: "0"
      - key: LEXOPEN_DEMO_SWITCHER
        value: "0"
      - key: LEXOPEN_TRUSTED_PROXY
        value: "1"
      # Con S3 configurado, el health exige storage persistente
      - key: LEXOPEN_REQUIRE_PERSISTENT_STORAGE
        value: "0"
      - key: HERMES_API_URL
        sync: false
      - key: HERMES_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: PJUD_API_URL
        sync: false
      - key: PJUD_API_KEY
        sync: false
      - key: PJUD_SCRAPER_URL
        fromService:
          name: lexopen-pjud-scraper
          type: pserv
          property: hostport
      - key: PJUD_SCRAPER_ALLOW_PRIVATE
        value: "1"
      - key: PJUD_PUBLIC_SCRAPE
        value: "0"
      - key: CAPTCHA_SOLVER_PROVIDER
        sync: false
      - key: CAPTCHA_SOLVER_API_KEY
        sync: false
      - key: PJUD_CLAVEUNICA_SCRAPE
        value: "0"
      - key: PJUD_ALLOW_DEMO
        value: "0"
      - key: PJUD_PDF_BACKUP
        value: "0"
      - key: PJUD_SYNC_INTERVAL_MINUTES
        value: "240"
      - key: PJUD_SYNC_CONCURRENCY
        value: "5"

  # Sidecar scrape privado (Playwright + CAPTCHA). Red interna Render.
  - type: pserv
    name: lexopen-pjud-scraper
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx playwright install chromium --with-deps
    startCommand: npm run pjud:scraper
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PJUD_PUBLIC_SCRAPE
        value: "1"
      - key: PJUD_CLAVEUNICA_SCRAPE
        value: "1"
      - key: PJUD_SCRAPER_KEY
        fromService:
          name: lexopen
          type: web
          envVarKey: PJUD_SCRAPER_KEY
      - key: CAPTCHA_SOLVER_PROVIDER
        sync: false
      - key: CAPTCHA_SOLVER_API_KEY
        sync: false
      - key: PJUD_CAUSAS_DAILY_SOLVE_BUDGET
        value: "50"

  # Cartera due-based cada 4h (UTC) — alineado a PJUD_SYNC_INTERVAL_MINUTES=240
  - type: cron
    name: lexopen-pjud-sync
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 */4 * * *"
    buildCommand: npm ci
    startCommand: 'curl -fsS -X POST "http://$WEB_HOSTPORT/api/causas/monitoreo" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{}"'
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        fromService:
          name: lexopen
          type: web
          envVarKey: CRON_SECRET

  # Mis Causas ~07:00 America/Santiago (10:00 UTC estándar) — antes del digest 08:00
  - type: cron
    name: lexopen-mis-causas
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 10 * * *"
    buildCommand: npm ci
    startCommand: 'curl -fsS -X POST "http://$WEB_HOSTPORT/api/pjud/mis-causas" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{\"syncMovimientos\":true}"'
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        fromService:
          name: lexopen
          type: web
          envVarKey: CRON_SECRET

  # Digest ~08:00 America/Santiago (12:00 UTC estándar) — estilo CausaMonitor 8 AM
  - type: cron
    name: lexopen-pjud-digest
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 12 * * *"
    buildCommand: npm ci
    startCommand: 'curl -fsS -X POST "http://$WEB_HOSTPORT/api/pjud/digest" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" -d "{}"'
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          name: lexopen
          type: web
          property: hostport
      - key: CRON_SECRET
        fromService:
          name: lexopen
          type: web
          envVarKey: CRON_SECRET
