appId: cl.perezibacache.lexopen
productName: LexOpen
executableName: lexopen
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
afterPack: scripts/after-pack.cjs
copyright: Copyright © LexOpen contributors
publish:
  provider: github
  owner: gabrielperezibacache
  repo: lexopen
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - backup.cjs
  - preload.cjs
  - config.cjs
  - external-url.cjs
  - media-permissions.cjs
  - update-policy.cjs
  - host-runtime.mjs
  - renderer/**/*
  - package.json
  - node_modules/**/*
  - "!**/.env*"
  - "!**/{.tmp,.git,.codex,.agents,storage,pgdata,vault,obsidian-vault,backups,secrets,private}/**"
  - "!**/*.{pem,key,p12,pfx,sqlite,sqlite3,db,dump,log}"
  - "!node_modules/**/{test,tests,__tests__,fixtures,examples}/**"
extraResources:
  - from: .release/resources/app-standalone
    to: app-standalone
    filter:
      - "**/*"
      - "**/.*"
      - "**/.*/**/*"
  - from: .release/resources/prisma
    to: prisma
    filter:
      - "**/*"
asarUnpack:
  # Electron's Node mode needs the complete dependency graph on the filesystem.
  - "node_modules/**/*"
  - host-runtime.mjs
  - config.cjs
  - package.json
mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # Unsigned preview packages are permitted; signed CI verifies Gatekeeper separately.
  gatekeeperAssess: false
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: LexOpen usa el micrófono cuando usted inicia una captura para transcribir y conservar el audio de su audiencia.
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Nunca borrar Application Support / %APPDATA%\LexOpen al actualizar o desinstalar
  deleteAppDataOnUninstall: false
  allowElevation: true
linux:
  maintainer: LexOpen contributors
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
extraMetadata:
  main: main.cjs
