appId: cl.perezibacache.lexopen
productName: LexOpen
copyright: Copyright © LexOpen contributors
publish:
  provider: github
  owner: gabrielperezibacache
  repo: lexopen
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - backup.cjs
  - preload.cjs
  - config.cjs
  - host-runtime.mjs
  - renderer/**/*
  - package.json
extraResources:
  - from: ../.next/standalone
    to: app-standalone
    filter:
      - "**/*"
  - from: ../.next/standalone/node_modules
    to: app-standalone/node_modules
    filter:
      - "**/*"
  - from: ../.next/static
    to: app-standalone/.next/static
    filter:
      - "**/*"
  - from: ../public
    to: app-standalone/public
    filter:
      - "**/*"
  - from: ../prisma
    to: prisma
    filter:
      - "**/*"
  - from: ../src
    to: app-standalone/src
    filter:
      - "**/*"
  - from: ../tsconfig.json
    to: app-standalone/tsconfig.json
  - from: ../next-env.d.ts
    to: app-standalone/next-env.d.ts
asarUnpack:
  - "node_modules/@prisma/**"
  - "node_modules/prisma/**"
  - "node_modules/@prisma/engines/**"
  - "node_modules/tsx/**"
  - "node_modules/esbuild/**"
  - "node_modules/get-tsconfig/**"
  - "node_modules/embedded-postgres/**"
  - "node_modules/@embedded-postgres/**"
  - "node_modules/pg/**"
  - "node_modules/pg-connection-string/**"
  - "node_modules/pg-int8/**"
  - "node_modules/pg-pool/**"
  - "node_modules/pg-protocol/**"
  - "node_modules/pg-types/**"
  - "node_modules/pgpass/**"
  - "node_modules/postgres-array/**"
  - "node_modules/postgres-bytea/**"
  - "node_modules/postgres-date/**"
  - "node_modules/postgres-interval/**"
  - "node_modules/split2/**"
  - "node_modules/xtend/**"
  - "node_modules/async-exit-hook/**"
mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Nunca borrar Application Support / %APPDATA%\LexOpen al actualizar o desinstalar
  deleteAppDataOnUninstall: false
  allowElevation: true
linux:
  target:
    - AppImage
  category: Office
extraMetadata:
  main: main.cjs
