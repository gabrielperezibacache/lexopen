appId: cl.perezibacache.lexopen
productName: LexOpen
copyright: Copyright © LexOpen contributors
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - config.cjs
  - host-runtime.mjs
  - renderer/**/*
  - package.json
extraResources:
  - from: ../.next/standalone
    to: app-standalone
    filter:
      - "**/*"
  - from: ../.next/static
    to: app-standalone/.next/static
    filter:
      - "**/*"
  - from: ../public
    to: app-standalone/public
    filter:
      - "**/*"
  - from: ../prisma
    to: prisma
    filter:
      - "**/*"
  - from: ../src
    to: app-standalone/src
    filter:
      - "**/*"
  - from: ../tsconfig.json
    to: app-standalone/tsconfig.json
  - from: ../next-env.d.ts
    to: app-standalone/next-env.d.ts
asarUnpack:
  - "node_modules/@prisma/**"
  - "node_modules/prisma/**"
  - "node_modules/@prisma/engines/**"
  - "node_modules/tsx/**"
  - "node_modules/esbuild/**"
  - "node_modules/get-tsconfig/**"
mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Nunca borrar Application Support / %APPDATA%\LexOpen al actualizar o desinstalar
  deleteAppDataOnUninstall: false
  allowElevation: true
linux:
  target:
    - AppImage
  category: Office
extraMetadata:
  main: main.cjs
