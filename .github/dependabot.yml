version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      compatible-runtime:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      compatible-desktop:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    open-pull-requests-limit: 5
    labels: [dependencies]
