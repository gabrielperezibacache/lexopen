name: CI

on:
  workflow_call:
    inputs:
      package_altazor:
        type: boolean
        default: false
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  altazor-computer-runtime:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
            check: altazor-computer-runtime
            evidence: altazor-computer-runtime-evidence
          - runner: ubuntu-24.04-arm
            architecture: arm64
            check: altazor-computer-runtime-arm64
            evidence: altazor-computer-runtime-evidence-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexopen
          POSTGRES_PASSWORD: fictitious-ci-only
          POSTGRES_DB: lexopen_computer_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexopen -d lexopen_computer_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lexopen:fictitious-ci-only@127.0.0.1:5432/lexopen_computer_e2e
      E2E_DATABASE_URL: postgresql://lexopen:fictitious-ci-only@127.0.0.1:5432/lexopen_computer_e2e
      SESSION_SECRET: fictitious-computer-runtime-ci-encryption-secret-2026
      ALTAZOR_COMPUTER_ENABLED: "1"
      LEXOPEN_ALTAZOR_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned desktop gateway source without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: madkoding/kitties
          ref: 6aee950bdf971ff41f3867763a0ec9f5ef8ef8e3
          path: .tmp/kitties-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tmp/kitties-upstream/go.mod
          cache: false
      - name: Verify native Linux container architecture
        run: test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "linux/$ALTAZOR_TOOLPACK_ARCH"
        env:
          ALTAZOR_TOOLPACK_ARCH: ${{ matrix.architecture }}
      - name: Prepare dedicated gateway UID and restrict runtime egress
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v setfacl >/dev/null || ! command -v getfacl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y acl
          fi
          sudo useradd --system --no-create-home --groups docker lexopen-kitties-ci
          gateway_uid="$(id -u lexopen-kitties-ci)"
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$gateway_uid" ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$gateway_uid" -j REJECT
      - name: Select owned runtime evidence directory
        shell: bash
        run: printf 'KITTIES_CI_OUTPUT=%s/altazor-computer-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Archive public source, build gateway and verify dedicated UID access
        shell: bash
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/.tmp/kitties-upstream"
          source_dir="$RUNNER_TEMP/kitties-source"
          test "$(git -C "$upstream" rev-parse HEAD)" = 6aee950bdf971ff41f3867763a0ec9f5ef8ef8e3
          mkdir "$source_dir"
          git -C "$upstream" archive HEAD | tar -xf - -C "$source_dir"
          test ! -e "$source_dir/.git"
          printf '%s\n' 6aee950bdf971ff41f3867763a0ec9f5ef8ef8e3 > "$source_dir/.lexopen-source-commit"
          node scripts/altazor/harden-connectors.test.mjs
          node scripts/altazor/harden-connectors.mjs "$source_dir"
          node scripts/altazor/harden-async-messages.test.mjs
          node scripts/altazor/harden-async-messages.mjs "$source_dir"
          (cd "$source_dir" && go test ./internal/chat ./internal/connector ./internal/gateway -run '^TestLexOpen' -count=1)
          make -C "$source_dir" WEB=0 VERSION=lexopen-ci build
          node scripts/altazor/prepare-computer-ci.test.mjs
          node scripts/altazor/prepare-computer-ci.mjs "$source_dir"
          printf 'KITTIES_CI_SOURCE=%s\n' "$source_dir" >> "$GITHUB_ENV"
      - name: Retrieve the same desktop source archive bundled by native installers
        if: ${{ inputs.package_altazor && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          name: altazor-desktop-source-context
          path: ${{ runner.temp }}/altazor-desktop-source
      - name: Prepare desktop source for non-release runtime checks
        if: ${{ !(inputs.package_altazor && startsWith(github.ref, 'refs/tags/v')) }}
        run: python3 scripts/altazor/prepare-desktop-source.py .tmp/kitties-upstream "$RUNNER_TEMP/altazor-desktop-source"
      - name: Build real immutable desktop image through the native installer preparation code
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const { prepareDesktopToolpack } = require('./desktop/altazor-toolpack.cjs');
          const { version } = require('./desktop/package.json');
          prepareDesktopToolpack(version, {
            resourceRoot: process.env.RUNNER_TEMP,
            fetcher: async () => new Response(null, { status: 404 }),
            progress: ({ state }) => console.log(state),
          }).then(({ state }) => { if (state !== 'package-loaded') { console.error(state); process.exitCode = 1; } });
          NODE
          profile_tag="$(node -p 'require("./desktop/altazor-desktop-profile.json").tag')"
          image_id="$(docker image inspect --format '{{.Id}}' "$profile_tag")"
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          printf 'KITTIES_CI_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Actual desktop broker with selected fictitious data and local model fixture
        run: node --import tsx scripts/altazor/computer-smoke.ts
        env:
          ALTAZOR_TOOLPACK_ARCH: ${{ matrix.architecture }}
      - name: Retain safe fictitious runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.evidence }}
          path: ${{ env.KITTIES_CI_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Export and restore the tested desktop image on the release runner
        if: ${{ inputs.package_altazor && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          ALTAZOR_TOOLPACK_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker builder prune --all --force
          node scripts/altazor/pack-desktop-image.mjs "$KITTIES_CI_OUTPUT/summary.json" "$RUNNER_TEMP/altazor-toolpack"
          version="$(node -p 'require("./desktop/package.json").version')"
          profile_tag="$(node -p 'require("./desktop/altazor-desktop-profile.json").tag')"
          docker image rm "$profile_tag"
          if docker image inspect "$profile_tag" >/dev/null 2>&1; then
            echo "The profile tag must be absent before checking archive restoration" >&2
            exit 1
          fi
          docker image load --input "$RUNNER_TEMP/altazor-toolpack/LexOpen-$version-altazor-linux-$ALTAZOR_TOOLPACK_ARCH.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' "$profile_tag")" = "$KITTIES_CI_IMAGE_ID"
      - name: Retain the desktop verification receipt
        if: ${{ inputs.package_altazor && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: altazor-toolpack-receipt-${{ matrix.architecture }}
          path: ${{ runner.temp }}/altazor-toolpack/*.json
          if-no-files-found: error
          retention-days: 7
  workbench-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/workbench/build-image.mjs
      - name: Real isolated document execution with fictitious inputs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/workbench-output"
          export LEXOPEN_WORKBENCH_IMAGE_ID="$(docker image inspect --format '{{.Id}}' lexopen-workbench-documents:1)"
          node --import tsx scripts/workbench/docker-smoke.ts
        env:
          CI: "true"
          LEXOPEN_WORKBENCH_TEST_DOCKER: "1"
          LEXOPEN_WORKBENCH_ENABLED: "1"
          LEXOPEN_WORKBENCH_TEST_OUTPUT: ${{ runner.temp }}/workbench-output
      - name: Open generated DOCX using LibreOffice
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
          libreoffice -env:UserInstallation=file:///tmp/lexopen-lo-ci --headless --convert-to pdf --outdir "$RUNNER_TEMP/workbench-output" "$RUNNER_TEMP"/workbench-output/*.docx
          pdftotext "$RUNNER_TEMP"/workbench-output/*.pdf "$RUNNER_TEMP/workbench-output/opened.txt"
          test -s "$RUNNER_TEMP/workbench-output/opened.txt"
          node -e 'if(!require("fs").readFileSync(process.argv[1],"utf8").includes("análisis"))process.exit(1)' "$RUNNER_TEMP/workbench-output/opened.txt"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexopen
          POSTGRES_PASSWORD: lexopen
          POSTGRES_DB: lexopen_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexopen -d lexopen_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lexopen:lexopen@localhost:5432/lexopen_e2e
      E2E_DATABASE_URL: postgresql://lexopen:lexopen@localhost:5432/lexopen_e2e
      STORAGE_PATH: ${{ github.workspace }}/.tmp/ci-test-storage
      SESSION_SECRET: ci-session-secret-16plus
      HERMES_ALLOW_DEMO: "1"
      LEXOPEN_RELAX_CSRF: "1"
      LEXOPEN_PDF_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npx prisma generate
      - name: Local PDF rendering and OCR
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - run: npx prisma migrate deploy
      # Fail if schema.prisma drifts from the DB after migrate deploy.
      - name: Prisma schema drift check
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
      - run: npm test
      - name: Check connection setup and OAuth errors
        run: node --import tsx --test src/lib/altazor/connectors/github-application-check.test.ts src/lib/altazor/connectors/oauth-token-response.test.ts
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pjud:browser
      - run: npm run e2e
        env:
          CODEX_BIN: ${{ github.workspace }}/e2e/fixtures/codex-app-server.mjs
          CODEX_DATA_DIR: /tmp/lexopen-codex-e2e
