name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build

  build:
    name: Build ${{ matrix.name }} installer
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS
            os: macos-13
            target: mac
          - name: Windows
            os: windows-latest
            target: win
    env:
      # Electron Builder signs when these secrets are present. Without them,
      # the workflow still produces unsigned artifacts for internal testing.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          test "$tag_version" = "$root_version"
          test "$tag_version" = "$desktop_version"
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Build installer
        shell: bash
        run: npm run desktop:dist:${{ matrix.target }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/**/*.dmg
            desktop/dist/**/*.exe
            desktop/dist/**/*.AppImage
            desktop/dist/**/*.zip
            desktop/dist/**/latest*.yml
            desktop/dist/**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.zip' \
            -o -name 'latest*.yml' -o -name '*.blockmap' \
          \) -print)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "LexOpen ${GITHUB_REF_NAME}"
